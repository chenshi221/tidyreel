# Push a tag like v1.1.0 to build the native macOS Swift app and publish a GitHub Release.
# The default TMDB key comes from the repository secret TMDB_TOKEN (never committed).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Info.plist
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$want" != "$have" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 Resources/Info.plist 的版本 $have 不一致，请用 tool/release.sh 发版"
            exit 1
          fi

      - name: Checks
        run: tool/check.sh

      - name: Default TMDB key
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -n "$TMDB_TOKEN" ]; then
            printf '{"TMDB_TOKEN":"%s"}' "$TMDB_TOKEN" > tmdb.local.json
            chmod 600 tmdb.local.json
          else
            echo "::warning::TMDB_TOKEN secret is not set; users will have to enter their own key"
          fi

      - name: Build
        run: tool/build_macos.sh release

      - name: Package
        run: |
          zip="Tidyreel-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --keepParent build/Release/tidyreel.app "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > notes.md
          printf '\n---\n未签名的测试版：首次打开请右键 tidyreel.app →「打开」，或在终端执行 `xattr -dr com.apple.quarantine tidyreel.app`\n\nUnsigned build: on first launch, right-click `tidyreel.app` → Open, or run `xattr -dr com.apple.quarantine tidyreel.app` in Terminal.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "理片 Tidyreel $GITHUB_REF_NAME" \
            --notes-file notes.md

      - name: Upload build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
